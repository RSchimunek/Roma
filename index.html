<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#39472F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roma">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Roma</title>
<style>
:root{--oliv:#39472F;--creme:#FAF7F0;--sand:#F0E9DA;--terra:#B85C38;--gedaempft:#7C7566}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100svh;display:grid;place-items:center;padding:24px;
  padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 80% 10%,#6d5b43 0%,#47402f 42%,#2b2820 100%);
  color:var(--creme);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.karte{width:100%;max-width:340px;text-align:center}
.bogen{width:64px;height:64px;margin:0 auto 22px;display:block}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:54px;
  line-height:1;letter-spacing:-.02em;margin-bottom:6px}
h1 em{font-style:italic;color:#EAD9B0}
.unter{font-family:Georgia,serif;font-style:italic;font-size:17px;color:#F0E4C9;margin-bottom:30px}
label{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;color:rgba(255,255,255,.72);margin-bottom:9px;text-align:left}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.1);color:#fff;font-size:17px;outline:none}
input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15)}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;cursor:pointer;
  background:var(--creme);color:var(--oliv);font-size:16px;font-weight:700}
button:disabled{opacity:.55;cursor:default}
.meldung{margin-top:14px;font-size:13.5px;min-height:20px;line-height:1.45}
.fehler{color:#F3B99C}
.info{color:rgba(255,255,255,.72)}
.fuss{margin-top:26px;font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.5}
</style>
</head>
<body>
<main class="karte">
  <svg class="bogen" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M20 46V28a12 12 0 0 1 24 0v18" fill="none" stroke="#FAF7F0" stroke-width="5"/>
    <rect x="14" y="46" width="36" height="5" fill="#B85C38"/>
  </svg>
  <h1>Rom<em>a</em></h1>
  <div class="unter">Vier Tage im goldenen Oktober</div>

  <form id="formular" autocomplete="off">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           enterkeyhint="go" aria-describedby="meldung">
    <button id="knopf" type="submit">Öffnen</button>
  </form>
  <div class="meldung info" id="meldung" role="status" aria-live="polite"></div>
  <div class="fuss">Der Reiseplan liegt verschlüsselt auf dem Server.
    Nach dem ersten Öffnen merkt sich dieses Gerät den Schlüssel und startet auch ohne Netz.</div>
</main>

<script>
const KOPF = 37;                 // Magic 5 + Iterationen 4 + Salz 16 + IV 12
const MAGIC = "ROMA1";
const SPEICHER = "roma-schluessel";

const formular = document.getElementById("formular");
const feld = document.getElementById("pw");
const knopf = document.getElementById("knopf");
const meldung = document.getElementById("meldung");

function sage(text, fehler) {
  meldung.textContent = text;
  meldung.className = "meldung " + (fehler ? "fehler" : "info");
}

// Service Worker: macht die App nach dem ersten Laden netzunabhaengig
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// ?reset entfernt den gemerkten Schluessel von diesem Geraet
if (location.search.includes("reset")) {
  try { localStorage.removeItem(SPEICHER); } catch (e) {}
  sage("Schlüssel auf diesem Gerät gelöscht.");
}

let paket = null;
async function holePaket() {
  if (paket) return paket;
  const antwort = await fetch("guide.enc");
  if (!antwort.ok) throw new Error("Datei nicht erreichbar (" + antwort.status + ")");
  const roh = new Uint8Array(await antwort.arrayBuffer());
  if (new TextDecoder().decode(roh.slice(0, 5)) !== MAGIC) throw new Error("Unbekanntes Dateiformat");
  paket = {
    iterationen: new DataView(roh.buffer, 5, 4).getUint32(0),
    salz: roh.slice(9, 25),
    iv: roh.slice(25, 37),
    inhalt: roh.slice(KOPF)
  };
  return paket;
}

async function schluesselAus(passwort, salz, iterationen) {
  const basis = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salz, iterations: iterationen, hash: "SHA-256" },
    basis, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function zeige(schluessel) {
  const p = await holePaket();
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, schluessel, p.inhalt);
  const html = new TextDecoder().decode(klar);
  document.open();
  document.write(html);
  document.close();
}

async function merke(schluessel) {
  try {
    const roh = new Uint8Array(await crypto.subtle.exportKey("raw", schluessel));
    localStorage.setItem(SPEICHER, btoa(String.fromCharCode(...roh)));
  } catch (e) { /* privater Modus: dann eben jedes Mal tippen */ }
}

async function ausSpeicher() {
  let b64 = null;
  try { b64 = localStorage.getItem(SPEICHER); } catch (e) { return null; }
  if (!b64) return null;
  const roh = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return crypto.subtle.importKey("raw", roh, "AES-GCM", true, ["decrypt"]);
}

formular.addEventListener("submit", async (e) => {
  e.preventDefault();
  const passwort = feld.value;
  if (!passwort) return;
  knopf.disabled = true;
  sage("Entschlüsseln …");
  try {
    const p = await holePaket();
    const schluessel = await schluesselAus(passwort, p.salz, p.iterationen);
    await zeige(schluessel);
    merke(schluessel);
  } catch (fehler) {
    knopf.disabled = false;
    feld.select();
    sage(fehler instanceof DOMException ? "Passwort falsch." : "Fehler: " + fehler.message, true);
  }
});

(async () => {
  if (!crypto.subtle) { sage("Dieser Browser kann die Datei nicht entschlüsseln.", true); return; }
  if (location.search.includes("reset")) { feld.focus(); return; }
  const schluessel = await ausSpeicher();
  if (!schluessel) { feld.focus(); return; }
  sage("Öffnen …");
  try {
    await zeige(schluessel);
  } catch (e) {
    try { localStorage.removeItem(SPEICHER); } catch (x) {}
    sage("Gespeicherter Schlüssel passt nicht mehr. Bitte Passwort eingeben.", true);
    feld.focus();
  }
})();
</script>
</body>
</html>
